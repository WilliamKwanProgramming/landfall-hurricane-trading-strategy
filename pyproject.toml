[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "landfall"
version = "0.1.0"
description = "Point-in-time hurricane forecasts, wind footprints and event-study machinery for testing whether prices reflect hurricane forecasts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyreadr>=0.5",
    "global-land-mask>=1.0",
]

[project.optional-dependencies]
prices = ["skfolio>=0.7"]
test = ["pytest>=8", "statsmodels>=0.14", "arch>=6", "ruff>=0.5", "pybind11>=3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
